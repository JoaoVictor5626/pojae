<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POJAE - Perfil Detalhado do Candidato</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="./assets/js/tailwind-config.js"></script>
    
    <script src="./assets/js/visualizar-candidato.js"></script>

    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen antialiased selection:bg-blue-500 selection:text-white">

    <!-- TOP HEADER / AVISO REGIONAL -->
    <div class="bg-pojae-900 text-slate-200 text-xs py-2 px-4 text-center font-medium border-b border-blue-900/50 flex items-center justify-center gap-2">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Ativo
        </span>
        <span><i class="fas fa-map-marker-alt text-red-400 mr-1"></i> Avaliação de Perfil Estudantil • Região de <strong>Maceió - AL</strong></span>
    </div>

    <!-- NAVBAR PRINCIPAL -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <a href="index.html" class="flex items-center gap-3 group z-50">
                <div class="logo-navbar">
                    <img src="./assets/images/pojae-logo.png" alt="POJAE Logo">
                </div>
            </a>

            <div class="flex items-center gap-3">
                <a id="btn-back-to-vacancies" href="dashboard-empresa.html" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-pojae-600 px-3 py-2 rounded-lg transition">
                    <i class="fas fa-arrow-left mr-1.5"></i> 
                    Voltar aos Candidatos da Vaga
                </a>
            </div>
        </div>
    </header>

    <!-- NOTIFICATION TOAST CONTAINER -->
    <div id="toast-container" class="fixed top-24 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- CONTEÚDO PRINCIPAL: PERFIL COMPLETO DO CANDIDATO -->
    <main id="candidate-profile-container" class="flex-grow py-8 sm:py-10 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto w-full space-y-8">
        <!-- Preenchido dinamicamente via JavaScript -->
    </main>

    <!-- Container do Footer Modular -->
    <div id="footer-container"></div>

    <!-- Script de Inclusão dos Componentes Modulares -->
    <script src="./assets/js/partials.js"></script>

</body>
</html>
