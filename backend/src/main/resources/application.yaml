spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pojae_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

logging:
  level:
    org:
      hibernate:
        type: trace
